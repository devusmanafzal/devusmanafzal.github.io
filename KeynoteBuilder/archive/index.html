<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The Digital Agency</title>
  <link rel="icon" href="data:,">
  <script>
    (() => {
      const param = new URLSearchParams(window.location.search).get("scoutTheme");
      const theme = param || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
      document.documentElement.setAttribute("data-theme", theme);
    })();
  </script>
  <link rel="stylesheet" href="styles/keynote.css">
  <script src="scripts/keynote.js" defer></script>
</head>
<body>
  <main class="cinema" aria-label="The Digital Agency conference keynote">
    <canvas class="cinema-canvas" aria-hidden="true"></canvas>
    <div class="cinema-vignette"></div>
    <div class="cinema-stage" aria-live="polite"></div>
    <div class="scene-count" data-visible="false" aria-hidden="true" aria-live="polite">00 / 00</div>
    <div class="control-hint"></div>
    <div class="progress-track"><div class="progress-fill"></div></div>
    <button class="scroll-cue" type="button" aria-label="Continue to the next scene">
      <span class="scroll-cue-arrow" aria-hidden="true"></span><span class="scroll-cue-arrow" aria-hidden="true"></span><span class="scroll-cue-arrow" aria-hidden="true"></span>
    </button>
  </main>
  <aside class="commentary-shell" data-open="false" data-available="false" data-disabled="false" aria-label="Presenter commentary">
    <div class="commentary-backdrop"></div>
    <button class="commentary-launcher" type="button" aria-label="Open presenter commentary" aria-expanded="false">
      <span class="commentary-avatar"><img src="assets/images/portraits/you.jpg" alt="Usman Afzal"></span>
      <span class="commentary-launcher-copy"><strong>Usman's commentary</strong><span>Read the story behind this scene</span></span>
    </button>
    <section class="commentary-blade" role="dialog" aria-modal="true" aria-hidden="true" aria-labelledby="commentaryTitle">
      <header class="commentary-blade-head">
        <div class="commentary-author"><span class="commentary-avatar"><img src="assets/images/portraits/you.jpg" alt=""></span><div><strong>Usman Afzal</strong><span>Presenter commentary</span></div></div>
        <button class="commentary-close" type="button" aria-label="Close commentary" title="Close commentary">×</button>
      </header>
      <div class="commentary-content"><p class="commentary-scene-label"></p><h2 class="commentary-title" id="commentaryTitle"></h2><div class="commentary-body"></div><div class="commentary-takeaway"></div></div>
      <p class="commentary-shortcut">Press C to hide commentary during a live demonstration.</p>
    </section>
  </aside>
  <div class="lightbox" data-open="false" role="dialog" aria-modal="true" aria-label="Expanded theme frame"><div class="lightbox-stage"></div></div>
  <div class="page-morph" aria-hidden="true"><div class="page-morph-mark">MICROSOFT SCOUT</div></div>
</body>
</html>
